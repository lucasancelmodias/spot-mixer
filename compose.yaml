name: spot-mixer

services:
  app:
    build: .
    env_file: .env
    environment:
      # These values override .env inside the container.
      HOST: 0.0.0.0
      PORT: '3000'
      REDIS_URL: redis://redis:6379
      SPOTIFY_REDIRECT_URI: http://127.0.0.1:3000/auth/callback
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:8.10.2-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--save',
        '300',
        '10',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'volatile-lru'
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis-data:
